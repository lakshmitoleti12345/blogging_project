{% extends 'home.html' %}
{% load static %}

{% block content %}

<style>
body{
    background-color: black;
}

/* Main container */
.upload-container{
    width: 42%;
    margin: 50px auto;
    padding: 30px;
    background: #111;
    border: 1px solid rgb(243,7,208);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(243,7,208,0.25);
    color: white;
}

/* Heading */
.upload-container h2{
    text-align: center;
    color: rgb(243,7,208);
    margin-bottom: 25px;
    font-size: 24px;
    letter-spacing: 1px;
}

/* Labels */
.upload-container label{
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: white;
}

/* Inputs + textarea */
.upload-container .form-control{
    width: 100%;
    padding: 10px;
    background: black;
    color: white;
    border: 1px solid rgb(243,7,208);
    border-radius: 8px;
    outline: none;
    margin-bottom: 12px;
}

/* Focus effect */
.upload-container .form-control:focus{
    border-color: rgb(243,7,208);
    box-shadow: 0 0 10px rgba(243,7,208,0.5);
}

/* File input fix */
.upload-container input[type="file"]{
    padding: 8px;
}

/* Button */
.upload-btn{
    width: 100%;
    background: rgb(243,7,208);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

/* Button hover */
.upload-btn:hover{
    background: white;
    color: rgb(243,7,208);
    transition: 0.3s;
    border: 1px solid rgb(243,7,208);
}

/* Responsive */
@media(max-width:768px){
    .upload-container{
        width: 90%;
    }
}
</style>

<div class="upload-container">
    <h2>Upload Your Blog</h2>

    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" name="name" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" name="email" required>
        </div>

        <div class="mb-3">
            <label>Title</label>
            <input type="text" class="form-control" name="title" required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" name="message" rows="5"></textarea>
        </div>

        <div class="mb-3">
            <label>Upload Image</label>
            <input type="file" class="form-control" name="image">
        </div>

        <button type="submit" class="upload-btn">
            Upload Blog
        </button>

    </form>
</div>

{% endblock %}
```
