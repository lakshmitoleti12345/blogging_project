{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="{%static 'css/bootstrap.css'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-grid.css'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-grid.css.map'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-grid.min.css'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-grid.min.css.map'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-reboot.css'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-reboot.css.map'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap-reboot.min.css'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap.css.map'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{%static 'css/bootstrap.min.css.map'%}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
     .logo{
    border: 3px solid rgb(243, 7, 208);
    width: 90%;
    height: 70px;

    border-top-left-radius: 40px;
    border-top-right-radius: 40px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;

    margin: 20px auto;

    display: flex;
    align-items: center;   /* vertically center */
    gap: 15px;             /* space between logo and text */
    padding-left: 20px;
}

.logo img{
    width: 50px;
    height: 50px;
    border-radius: 50%;
  margin-left: 20px;
}

.logo h1{
    margin-left: 230px;
    font-family: 'Dancing Script', cursive;
    font-size: 35px;
    color: rgb(243, 7, 208);
    text-align: center;

}
.navbar{
    display:flex;
    align-items:center;
    gap:20px;
}

.navbar h1{
    color:rgb(243,7,208);
    margin-right:auto;
}
.navbar a{
  color: white;
  margin-left:20px;
  text-decoration: none;
}
.navbar a:hover{
  color: rgb(243,7,208);
}
.fruits-1{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    padding: 20px;
}

.f_cart1{
    width: 100%;
    max-width: 250px;
    height: 450px;
    border: 1px solid rgb(243,7,208);
    border-radius: 20px;
    margin: auto;
}

.img img{
    width: 100%;
    height: 240px;
    border-radius: 20px;
}
.ct{
  text-align: center;
}
.ct h4{
color:white;
margin: 0px 0px 8px;
font-family: sans-serif;

}
.ct h6{
color:white;
margin: 0px 0px 8px;
font-family: sans-serif;

}
.ct p{
  color:white;
margin: 0px 0px 16px;
font-family: sans-serif;
font-size: 10px;
}
.edit-btn{
    background-color: rgb(243,7,208);
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    text-decoration: none;
    border: 1px solid rgb(243,7,208);
    margin-right: 5px;
    font-size: 14px;
}

.edit-btn:hover{
    background-color: white;
    color: rgb(243,7,208);
    transition: 0.3s;
}

.delete-btn{
    background-color: black;
    color: rgb(243,7,208);
    padding: 8px 15px;
    border-radius: 8px;
    text-decoration: none;
    border: 1px solid rgb(243,7,208);
    font-size: 14px;
}

.delete-btn:hover{
    background-color: rgb(243,7,208);
    color: white;
    transition: 0.3s;
}
    </style>

</head>
<body style="background-color:black;">
<div class="logo">
 <span> <img src="https://tse1.mm.bing.net/th/id/OIP.YBdeulqiQADrL_qdnTbhrwHaHa?pid=Api&P=0&h=180" alt=""></span>

  <span><h1>Blogging Application</h1></span>
</div>
  <div class="navbar">
    <span><h1>Blogging</h1></span>
    <a href="{% url 'home'%}">Home</a>
    <a href="{% url 'upload' %}" >
        Blog Upload
    </a>
    <a href="{% url 'about'  %}">About</a>
    <a href="{% url 'logout' %}" >
        Logout
    </a>
    
    
    

  </div>
  {% block content %}
  <div class="fruits-1">
  {% for i in post %}
<div class="f_cart1">
        <div class="img">
            <img src="{{ i.image.url }}" alt="">
        </div>

       <div class="ct">
    <h4>Title: {{ i.title }}</h4>
    <p><strong>Description:</strong> {{ i.message }}</p>
    <h6>Author: {{ i.name }}</h6>

    {% if request.user == i.user %}
      <div style="margin-top:10px;">
    <a href="{% url 'edit_post' i.id %}" class="edit-btn">
        Update
    </a>

    <a href="{% url 'delete_post' i.id %}" class="delete-btn">
        Delete
    </a>
</div>
    {% endif %}
</div>
    </div>
     
  {% endfor %}
  </div>


{% endblock content %}
    
   



</body>
  <script src="{% static 'js/bootstrap.js'%}"></script>
  <script src="{% static 'js/bootstrap.js.map'%}"></script>
  <script src="{% static 'js/bootstrap.min.js.map'%}"></script>
  <script src="{% static 'js/bootstrap.min.js'%}"></script>
  <script src="{% static 'js/bootstrap.bundle.js'%}"></script>
  <script src="{% static 'js/bootstrap.bundle.js.map'%}"></script>
  <script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
  <script src="{% static 'js/bootstrap.bundle.min.js.map'%}"></script>
</html>
