{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
     body{
        background-color:black;
     }

     .logo{
        border: 3px solid rgb(243, 7, 208);
        width: 90%;
        height: 70px;
        border-radius: 40px;
        margin: 20px auto;
        display: flex;
        align-items: center;
        gap: 15px;
        padding-left: 20px;
     }

     .logo img{
        width: 50px;
        height: 50px;
        border-radius: 50%;
     }

     .logo h1{
        margin-left: 230px;
        font-family: 'Dancing Script', cursive;
        font-size: 35px;
        color: rgb(243, 7, 208);
     }

     .navbar a{
        color:white;
        margin-left:20px;
        text-decoration:none;
     }

     .navbar a:hover{
        color:rgb(243,7,208);
     }

     .fruits-1{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:25px;
        padding:20px;
     }

     .f_cart1{
        width:250px;
        height:450px;
        border:1px solid rgb(243,7,208);
        border-radius:20px;
        margin:auto;
     }

     .img img{
        width:100%;
        height:240px;
        border-radius:20px;
     }

     .ct{
        text-align:center;
        color:white;
     }

     .edit-btn{
        background:rgb(243,7,208);
        color:white;
        padding:6px 12px;
        border-radius:8px;
        text-decoration:none;
     }

     .delete-btn{
        background:black;
        color:rgb(243,7,208);
        border:1px solid rgb(243,7,208);
        padding:6px 12px;
        border-radius:8px;
        text-decoration:none;
     }

    </style>
</head>

<body>

<div class="logo">
    <img src="https://tse1.mm.bing.net/th/id/OIP.YBdeulqiQADrL_qdnTbhrwHaHa?pid=Api&P=0&h=180">
    <h1>Blogging Application</h1>
</div>

<div class="navbar">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'upload' %}">Blog Upload</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'logout' %}">Logout</a>
</div>

{% block content %}

<div class="fruits-1">

{% for i in post %}
<div class="f_cart1">

    <div class="img">
        {% if i.image %}
            <img src="{{ i.image.url }}">
        {% endif %}
    </div>

    <div class="ct">
        <h4>{{ i.title }}</h4>
        <p>{{ i.message }}</p>
        <h6>{{ i.name }}</h6>

        {% if request.user == i.user %}
        <div style="margin-top:10px;">
            <a href="{% url 'edit_post' i.id %}" class="edit-btn">Update</a>
            <a href="{% url 'delete_post' i.id %}" class="delete-btn">Delete</a>
        </div>
        {% endif %}
    </div>

</div>
{% endfor %}

</div>

{% endblock %}

</body>
</html>
