```html
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:black;
            padding:20px;
        }

        .container{
            width:450px;
            background:black;
            padding:40px;
            border-radius:20px;
            border:1px solid rgb(243,7,208);
            box-shadow:0 0 20px rgba(243,7,208,0.5);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:rgb(243,7,208);
        }

        .input-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:white;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid rgb(243,7,208);
            border-radius:10px;
            outline:none;
            background:#111;
            color:white;
        }

        input:focus{
            border-color:rgb(243,7,208);
            box-shadow:0 0 10px rgba(243,7,208,0.5);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:rgb(243,7,208);
            color:white;
            font-size:16px;
            font-weight:bold;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:white;
            color:rgb(243,7,208);
        }

        p{
            text-align:center;
            margin-top:15px;
            color:white;
        }

        a{
            color:rgb(243,7,208);
            text-decoration:none;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Create Account</h2>

    <form action="" method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password1" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" name="password2" required>
        </div>

        <button type="submit">Register</button>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </form>

</div>

</body>
</html>
```
